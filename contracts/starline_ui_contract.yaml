contract: starline_telemetry_dashboard
version: "0.7.0-beta003"
ui_standard: 2.2
mode: read_only
repository_owner: NikaSir/ha-starline-telemetry
repository_policy: self_contained
parent: /home/overview
panel_path: /starline

rules:
  vehicle_write_commands: forbidden
  unsupported_entities: omit
  unavailable_is_normal: false
  entity_binding: registry_unique_id
  user_renamed_entity_ids: supported
  more_info_on_tap: read_only_domains_only
  history_source: starline_open_api_events_with_recorder_fallback
  trips_source: device_tracker_history
  external_starline_history_calls: read_only_quota_limited
  external_ui_repository_dependency: forbidden
  stable_shell_mount: once
  telemetry_rendering: point_patch_in_animation_frame
  historical_runtime_inheritance: forbidden

assets:
  local_only: true
  base_path: custom_components/starline_telemetry/frontend/assets
  manifest: custom_components/starline_telemetry/frontend/panel_manifest.json
  telemetry_in_artwork: forbidden
  portraits: matched_geometry_and_camera_angle
  state_based_image_switching: forbidden
  files:
    - starline-car-130-v2.webp
    - starline-car-683-v2.webp

zoom:
  required: true
  viewport_count: 1
  target: workspace_only
  engine: translate3d_scale
  state: [scale, x, y]
  css_zoom: forbidden
  native_scroll_as_canvas_state: forbidden
  native_vertical_scroll_at_or_below_100_percent: required
  home_assistant_header_scaled: false
  bottom_navigation_scaled: false
  offsets_at_or_below_100_percent: {x: 0, y: 0}
  one_finger_pan_at_all_scales: false
  one_finger_pan_above_100_percent_only: true
  pan_axes: overflowing_axes_only
  fit_axis_offset: 0
  pinch_to_zoom: true
  pinch_origin: midpoint_between_touches
  screen_controls: forbidden
  reset_gesture: two_finger_double_tap
  reset_state: {scale: 1, x: 0, y: 0}
  snap_percent_range: [97, 103]
  reset_feedback: Масштаб 100%
  min_percent: 75
  max_percent: 200
  allow_pan_when_zoomed: true
  clamp_to_scaled_content_bounds: true
  persistence: local_panel_client_with_separate_overview_and_vehicle_keys
  persisted_offsets: valid_above_100_percent_only
  restore_before_visible_frame: true
  tab_switch_native_scroll: top
  re_clamp_on: [pinch_end, rerender, resize, orientation_change, restore, tab_switch]
  gesture_click_guard: true
  stationary_long_press_preserved: true
  responsive_layout_preserved: true

source_priority:
  - starline_telemetry
  - core_starline

source_unique_id_patterns:
  core_starline: "starline-{role}-{device_id}"
  starline_telemetry: "{device_id}_{role}"

role_aliases:
  armed: [armed, lock, security]
  engine_running: [engine_running, run]
  ignition: [ignition, run]
  cabin_temperature: [cabin_temperature, ctemp]
  engine_temperature: [engine_temperature, etemp]
  gsm_level: [gsm_level, gsm_lvl]
  gps_satellites: [gps_satellites, gps_count]
  fuel: [fuel, fuel_percent, fuel_litres]
  odometer: [odometer, mileage]
  location: [vehicle_location, location]
  parking: [hbrake]

summary_screen:
  title: Сводка
  purpose: simultaneous_vehicle_summary
  vehicle_order: ["130", "683"]
  vehicle_cards: simultaneous_overview
  vehicle_switcher: hidden_on_summary
  phone_portrait: stacked_cards_at_100_percent_with_details_collapsed
  model_label: Nissan Murano
  workspace_heading: false
  per_vehicle:
    portrait: fixed_local_color_matched_image
    primary_metrics: [fuel, battery, engine_running, security]
    metric_tile:
      label: bold_centered_top
      label_weight: 750
      reading: centered_icon_and_value_same_line
      text_overflow_policy: wrap_without_clipping
    perimeter: [door, hood, trunk]
    secondary_metrics: expandable_details
    freshness:
      source: home_assistant_last_reported_then_last_updated
      max_age_minutes: 30
      timestamp_timezone: Europe/Moscow
      states: [fresh, stale, unavailable]
    security:
      armed: Включена
      disarmed: Снята
      alarm: Тревога
      stale: Устарело
      unknown: Нет данных
      armed_source_priority: [lock, armed, security, arm, guard]
      conflict_policy: first_reliable_home_assistant_source_wins
      bootstrap_max_age_seconds: 60
      unavailable_home_assistant_state: unknown_without_bootstrap_fallback
  map: false

fuel_calibration:
  view: diagnostics
  write_access: home_assistant_admin
  storage: home_assistant_per_starline_device
  source_unit: "%"
  start: capture_fresh_home_assistant_report_before_refuel
  mark_full: confirm_refuel_ended_with_receipt
  finish: require_increased_fuel_with_state_change_after_full_mark
  finish_window_minutes: 30
  record_receipt:
    inputs: [receipt_date, receipt_time, receipt_litres]
    timezone: Europe/Moscow
    source: home_assistant_recorder
    baseline_lookback_hours: 24
    before_window_minutes: 5
    after_window_minutes: 30
    missing_readings: do_not_create_calibration_sample
  panel_sync_seconds: 60
  panel_sync_transport: local_home_assistant_websocket
  inputs: [receipt_litres, optional_confirmed_capacity_litres]
  minimum_compatible_full_refuels: 3
  full_value: median_of_compatible_full_reports
  factor: 100_divided_by_median_full_value
  consistency: full_value_spread_and_receipt_checks
  display_estimate: only_for_fresh_readings_from_matching_calibrated_source
  raw_reading_visible: true
  factory_factors: forbidden
  vehicle_commands: forbidden

typography:
  reference: official_starline_mobile_app
  minimum_size: corresponding_reference_text_size
  smaller_than_reference: forbidden
  responsive_reduction_below_reference: forbidden
  applies_to: all_panel_views
  implementation_floors_px:
    compact_label: 11
    standard_secondary_text: 12
    summary_value: 14
    view_title: 21
    history_date_and_time: 16
    history_action: 18

shell:
  header:
    columns: ["52px", "minmax(0,1fr)", "52px"]
    phone_min_height_px: 60
    safe_area_top: env(safe-area-inset-top)
    safe_area_count: exactly_once
    control_size_px: 44
    control_radius_px: 16
    icon_size_px: 25
    title_px: 23
    subtitle_px: 14
    title_action: return_to_declared_parent
  peer_selector:
    visible_on: [history, trips, diagnostics]
  bottom_navigation:
    fixed_outside_zoom_viewport: true
    minimum_target_height_px: 52
    icon_size_px: 26
    label_size_px: 12
  work_viewport:
    count: 1
    only_scroll_surface: true
    shell_scroll_chaining: forbidden

rendering:
  production_component: single_autonomous_runtime
  shell_inner_html_after_mount: forbidden
  telemetry_patch_frame: requestAnimationFrame
  cached_views: lazy_and_reused
  unchanged_image_src_assignment: forbidden
  map_cards: stable_per_vehicle_view

navigation:
  title_parent: /home/overview
  ambient_return_authority: false
  title_uses_history_back: false
  title_uses_push_state_and_location_changed: true

history:
  window_hours: 24
  preferred_source: official_starline_open_api_events
  preferred_endpoint: POST_read_only_/json/v2/device/{device_id}/events
  preferred_timestamp: source_event_timestamp
  preferred_labels: official_event_description_library
  fallback_source: home_assistant_history_api
  fallback_timestamp: home_assistant_detection_timestamp
  fallback_filter: confirmed_state_transitions_only
  fallback_same_state_updates: omit
  fallback_unavailable_recovery: omit
  source_detail: display_only_when_returned_by_starline
  token_scope: home_assistant_backend_only
  token_exposure_to_frontend: forbidden
  daily_cloud_request_budget: 150
  roles: [armed, lock, alarm, door, hood, trunk, parking, ignition, engine_running, r_start, service_mode]
  commands: []

trips:
  window_hours: 72
  source: device_tracker_recorder_history
  map_source: home_assistant_map_card
  route_estimation: haversine_from_recorded_points
  commands: []

tabs:
  - id: status
    title: Сводка
    purpose: simultaneous_vehicle_summary
  - id: history
    title: История
    purpose: vehicle_state_event_timeline
    commands: []
  - id: trips
    title: Поездки
    purpose: recorder_based_movement_history
    commands: []
  - id: diagnostics
    title: Диагностика
    purpose: source_health_entity_availability_and_local_fuel_calibration
    commands: []

migration:
  current: core_starline_bridge
  target: starline_telemetry
  requirement: panel_layout_must_not_change_when_source_changes
