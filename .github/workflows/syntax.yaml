name: Syntax validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components/starline_telemetry
      - name: Check panel JavaScript
        run: |
          for file in custom_components/starline_telemetry/frontend/*.js; do
            node --check "$file"
          done
          python scripts/build_frontend_bundle.py
          git diff --exit-code -- custom_components/starline_telemetry/frontend/starline-app.js
          node tests/test_frontend_bundle.cjs
      - name: Check panel assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/starline_telemetry/frontend')
          manifest = json.loads((root / 'panel_manifest.json').read_text())
          missing = [asset for asset in manifest['assets'] if not (root / asset).is_file()]
          if missing:
              raise SystemExit('Missing panel assets: ' + ', '.join(missing))
          brand = Path('custom_components/starline_telemetry/brand/icon.png')
          if not brand.is_file() or brand.stat().st_size == 0:
              raise SystemExit('Missing packaged integration brand/icon.png')
          print(f"Validated {len(manifest['assets'])} panel assets")
          PY
