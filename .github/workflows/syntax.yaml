name: Syntax validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components/starline_telemetry
      - name: Check panel JavaScript
        run: node --check custom_components/starline_telemetry/frontend/starline-app-v001.js
